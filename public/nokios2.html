<script>
  function validateForm2() {
    var currentEmail = document.forms["quizz-form"]["email"].value;
    var currentPhone= document.forms["quizz-form"]["phone"].value;
    var noError = true;
    if (currentEmail == "") {
      textField= document.getElementById('email');
      textField.style.border = '2px solid red';
      window.alert('Mailadresse må fylles ut');
      noError = false;
      return(false);
    }

    if (!isValidEmail(currentEmail)) {
      textField= document.getElementById('email');
      textField.style.border = '2px solid red';
      window.alert('Ugydlig mailadresse');
      noError = false;
      return(false);
    }

    if (!isNotCommonFreeMail(currentEmail)) {
      textField= document.getElementById('email');
      textField.style.border = '2px solid red';
      window.alert('Bruk Jobbmail');
      noError = false;
      return(false);
    }
    console.log(currentPhone);
    if (currentPhone == "") {
      textField= document.getElementById('phone');
      textField.style.border = '2px solid red';
      window.alert('Telefonnr må fylles ut');
      noError = false;
      return(false);
    }

    if (!isValidPhoneNumber(currentPhone)) {
      textField= document.getElementById('phone');
      textField.style.border = '2px solid red';
      noError = false;
    }
    var queryGroups=['q1','q2','q3'];
    var chValues=[-1,-1,-1];
    var fasits=[2,1,1];
    correctAnswer=0;
    for(qGroup=0;qGroup<3;qGroup++) {
      var ele = document.getElementsByName(queryGroups[qGroup]);
      for (i = 0; i < ele.length; i++) {
        if (ele[i].checked) {
          chValues[qGroup]=i;
        }
      }
    }

    // Verify queries
    comment='Quizz ';
    groupMissing=false;
    for (i=0; i<3;i++) {
      if (chValues[i] < 0) {
        comment=comment+' '+(i+1)+' ';
        groupMissing=true;
      }
    }
    if (groupMissing ) {
      alert(comment+' mangler svar');
      noError=false;
    }
 
    if (!noError) {
      return(noError);
    }
    //
    // Check number of correct answers
    //
    correctAnswer=0;
    for(i=0;i<3;i++) {
      if (chValues[i] == fasits[i]) {
        correctAnswer++;
      }
    }
  }

  function isValidEmail(email) {
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    return emailRegex.test(email);
  }

  function isValidPhoneNumber(phoneNumber) {
  const regex = /^\+?\d+$/;
  return regex.test(phoneNumber);
}

/**
 * Checks if a given email address is NOT from a list of common free email providers.
 * * This function is copied directly from your Canvas document.
 *
 * @param {string} email - The email address to check.
 * @returns {boolean} - true if the email is valid and its domain is NOT a common free provider, false otherwise.
 */
function isNotCommonFreeMail(email) {
    if (typeof email !== 'string' || !email.trim()) {
        console.error("Invalid input: Email must be a non-empty string.");
        return false;
    }

    const trimmedEmail = email.trim().toLowerCase();

    // 1. Basic format validation (ensures there is an @ symbol and a domain part)
    // This simple regex checks for 'a@b.c' structure.
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailRegex.test(trimmedEmail)) {
        // If the format is bad, we consider it a validation failure for this purpose.
        return false;
    }

    // List of common free email domains (must be in lowercase)
    const commonFreeDomains = new Set([
        'gmail.com',
        'yahoo.com',
        'hotmail.com',
        'outlook.com',
        'aol.com',
        'icloud.com',
        'mail.com',
        'gmx.com',
        'zoho.com',
        'protonmail.com',
        'yandex.com',
        'web.de',
        't-online.de',
        'live.com',
        // Add more common free domains as needed
    ]);

    // 2. Extract the domain name
    const parts = trimmedEmail.split('@');
    if (parts.length !== 2) {
        return false;
    }

    const domain = parts[1];

    // 3. Check if the domain is in the list of common free domains
    const isFreeDomain = commonFreeDomains.has(domain);

    return !isFreeDomain;
}

/**
 * Handler function called when the email input loses focus (onblur event).
 */
function validateEmail() {
    const emailInput = document.getElementById('email');
    const feedbackDiv = document.getElementById('email-feedback');
    const submitButton = document.getElementById('submit-button');
    const email = emailInput.value;

    // 1. Clear previous state if the field is empty
    if (!email) {
        feedbackDiv.className = 'hidden';
        submitButton.disabled = true;
        submitButton.className = 'w-full py-3 px-4 bg-gray-400 text-white font-semibold rounded-xl transition duration-300 ease-in-out shadow-md cursor-not-allowed';
        return;
    }

    // 2. Run the core validation logic
    const isNonFreeDomain = isNotCommonFreeMail(email);

    // 3. Update the UI based on the result
    feedbackDiv.classList.remove('hidden');

    if (isNonFreeDomain) {
        // Valid (not a free domain)
        feedbackDiv.textContent = "✅ Success: This appears to be a corporate or custom email address.";
        feedbackDiv.className = 'p-3 rounded-xl bg-green-100 text-green-700 font-semibold mt-4 shadow-inner';
        
        // Enable submission
        submitButton.disabled = false;
        submitButton.className = 'w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl transition duration-300 ease-in-out shadow-lg hover:shadow-xl';

    } else {
        // Invalid (free domain or bad format)
        
        // Check if it failed due to bad format or being a free domain
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if (!emailRegex.test(email)) {
            feedbackDiv.textContent = " Error: The email format is invalid. Please check your spelling.";
        } else {
            feedbackDiv.textContent = " Error: Please use a corporate or non-common free email address (e.g., not Gmail, Yahoo, etc.).";
        }
        
        feedbackDiv.className = 'p-3 rounded-xl bg-red-100 text-red-700 font-semibold mt-4 shadow-inner';
        
        // Disable submission
        submitButton.disabled = true;
        submitButton.className = 'w-full py-3 px-4 bg-gray-400 text-white font-semibold rounded-xl transition duration-300 ease-in-out shadow-md cursor-not-allowed';
    }
}
